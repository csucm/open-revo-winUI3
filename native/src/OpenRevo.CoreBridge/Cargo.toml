[package]
name = "openrevo-native-bridge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "openrevo_native_bridge"
crate-type = ["cdylib"]

[dependencies]
openrevo-core = { path = "../OpenRevo.Upstream/crates/openrevo-core" }
serde_json = "1.0"

[profile.release]
opt-level = "s"
panic = "unwind"

