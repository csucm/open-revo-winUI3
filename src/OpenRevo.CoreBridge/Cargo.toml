[package]
name = "openrevo-native-bridge"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "openrevo_native_bridge"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "openrevo-resident"
path = "src/resident_main.rs"


[dependencies]
serde = { version = "1.0", features = ["derive"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Devices_Display", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Wmi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
openrevo-core = { path = "../OpenRevo.Upstream/crates/openrevo-core" }
serde_json = "1.0"
libloading = "0.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "unwind"

